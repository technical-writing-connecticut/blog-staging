openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quiet Press blog and editorial API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Published and editorial post operations
  - name: comments
    description: Reader comments and moderation
  - name: admin
    description: Editorial summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, all]
            default: published
          description: Editorial status filter
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{slug}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{id}:
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [comments]
      summary: List approved comments for a post
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Submit a reader comment
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for moderation
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
  /comments/{id}:
    patch:
      operationId: moderateComment
      tags: [comments]
      summary: Approve or reject a comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentModeration"
      responses:
        "200":
          description: Moderated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get editorial summary
      responses:
        "200":
          description: Editorial counts and latest post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Post:
      type: object
      properties:
        id:
          type: number
        slug:
          type: string
        title:
          type: string
        dek:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [draft, published]
        author:
          type: string
        readTime:
          type: number
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - title
        - dek
        - content
        - status
        - author
        - readTime
        - tags
        - publishedAt
        - createdAt
        - updatedAt
    PostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        dek:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, published]
        author:
          type: string
          minLength: 1
        readTime:
          type: number
          minimum: 1
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
      required: [title, dek, content, author]
    PostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        dek:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, published]
        author:
          type: string
          minLength: 1
        readTime:
          type: number
          minimum: 1
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
    Comment:
      type: object
      properties:
        id:
          type: number
        postId:
          type: number
        postTitle:
          type: string
        authorName:
          type: string
        authorEmail:
          type: ["string", "null"]
        body:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - postId
        - postTitle
        - authorName
        - authorEmail
        - body
        - status
        - createdAt
    CommentInput:
      type: object
      properties:
        authorName:
          type: string
          minLength: 1
        authorEmail:
          type: ["string", "null"]
        body:
          type: string
          minLength: 1
      required: [authorName, body]
    CommentModeration:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, pending]
      required: [status]
    AdminSummary:
      type: object
      properties:
        postCount:
          type: number
        draftCount:
          type: number
        pendingCommentCount:
          type: number
        publishedCommentCount:
          type: number
        latestPost:
          anyOf:
            - $ref: "#/components/schemas/Post"
            - type: "null"
      required:
        - postCount
        - draftCount
        - pendingCommentCount
        - publishedCommentCount
        - latestPost